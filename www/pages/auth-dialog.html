<dialog class="auth-dialog" id="auth-dialog" aria-labelledby="login-title">
  <section class="auth-panel" data-auth-panel="login">
    <h2 id="login-title">Login</h2>
    <form class="auth-form">
      <label for="login-email">Email</label>
      <input id="login-email" name="email" type="email" autocomplete="email" required>
      <label for="login-password">Password</label>
      <input id="login-password" name="password" type="password" autocomplete="current-password" required>
      <button class="button auth-submit" type="submit">Login</button>
      <p class="auth-switch">Ainda não tem uma conta? <button type="button" data-auth-view="register">Registrar</button></p>
    </form>
  </section>
  <section class="auth-panel" data-auth-panel="register" hidden>
    <h2 id="register-title">Registrar</h2>
    <form class="auth-form">
      <label for="register-name">Nome</label>
      <input id="register-name" name="name" type="text" autocomplete="given-name" required>
      <label for="register-surname">Sobrenome</label>
      <input id="register-surname" name="surname" type="text" autocomplete="family-name" required>
      <label for="register-email">Email</label>
      <input id="register-email" name="email" type="email" autocomplete="email" required>
      <label for="register-password">Password</label>
      <input id="register-password" name="password" type="password" autocomplete="new-password" minlength="8" required>
      <button class="button auth-submit" type="submit">Criar</button>
      <p class="auth-switch">Já tem uma conta? <button type="button" data-auth-view="login">Login</button></p>
    </form>
  </section>
  <p class="auth-notice" role="status" hidden></p>
  <script src="/scripts/auth-popup.js"></script>

</dialog>
