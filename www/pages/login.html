<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Discos</title>
    <link rel="stylesheet" href="/styles/pages/main.css" type="text/css">
  </head>
  <body>
    <header>
      <h1 class="title">Discos</h1>
      <div class="button-row">
        <button class="button button-secondary" type="button" data-auth-view="login">Login</button>
        <button class="button" type="button" data-auth-view="register">Register</button>
      </div>
    </header>
    <dialog class="auth-dialog" id="auth-dialog" aria-labelledby="login-title">
      <button class="dialog-close" type="button" aria-label="Close dialog">&times;</button>
      <section class="auth-panel" data-auth-panel="login">
        <h2 id="login-title">Login</h2>
        <form class="auth-form">
          <label for="login-email">Email</label>
          <input id="login-email" name="email" type="email" autocomplete="email" required>
          <label for="login-password">Password</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" required>
          <button class="button auth-submit" type="submit">Login</button>
        </form>
        <p class="auth-switch">Don't have an account? <button type="button" data-auth-view="register">Register</button></p>
      </section>
      <section class="auth-panel" data-auth-panel="register" hidden>
        <h2 id="register-title">Register</h2>
        <form class="auth-form">
          <label for="register-name">Nome</label>
          <input id="register-name" name="name" type="text" autocomplete="given-name" required>
          <label for="register-surname">Sobrenome</label>
          <input id="register-surname" name="surname" type="text" autocomplete="family-name" required>
          <label for="register-email">Email</label>
          <input id="register-email" name="email" type="email" autocomplete="email" required>
          <label for="register-password">Password</label>
          <input id="register-password" name="password" type="password" autocomplete="new-password" minlength="8" required>
          <button class="button auth-submit" type="submit">Criar</button>
        </form>
        <p class="auth-switch">Already have an account? <button type="button" data-auth-view="login">Login</button></p>
      </section>
      <p class="auth-notice" role="status" hidden>ainda nao ta</p>
    </dialog>
    <script src="/scripts/auth-popup.js"></script>
  </body>
</html>
